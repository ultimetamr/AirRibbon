function applyScenario(){const pair=scenarioEffects[component]?.[componentState];if(!pair)return;let el=document.querySelector(`[data-preview-id="${pair[0]}"]`);if(el){el.dataset.observableScenario=`${component}.${componentState}`;if(el.matches('button')){el.textContent=pair[1];el.disabled=['disabled','empty','clearing'].includes(componentState)}else if(/label|result|summary|guide|readout|hint|count|title/.test(pair[0]))el.textContent=pair[1];else el.title=pair[1];el.style.outline=componentState.includes('error')?'3px solid var(--coral)':'3px solid var(--accent)'}

if(component==='MaterialDock'&&dockEl){if(componentState==='left'){dockEl.style.left='auto';dockEl.style.right='2%'}if(componentState==='right'){dockEl.style.left='2%';dockEl.style.right='auto'}if(componentState==='constrained'){dockEl.style.width='190px';dockEl.querySelectorAll('.chips').forEach((x,i)=>x.classList.toggle('hidden',i>0))}if(componentState==='focused')dockEl.style.boxShadow='0 0 0 4px #66F7FF';if(componentState==='photo')dockEl.classList.add('hidden')}
if(component==='ArtworkManipulator'&&bounds){if(componentState==='empty')bounds.classList.add('hidden');if(componentState==='dragging')bounds.style.transform='translate(35px,-12px)';if(componentState==='scaling')bounds.style.transform='scale(1.18)';if(componentState==='boundaryDisabled')bounds.style.borderColor='#FFD166'}
if(component==='TrailCanvas'&&mesh){if(componentState==='empty')mesh.querySelector('.ribbon').classList.add('hidden');if(componentState==='buffering')mesh.style.opacity='.65';if(componentState==='boundaryDisabled')mesh.style.filter='none';if(componentState==='foam'){const p=mesh.querySelector('path');p.style.strokeWidth='30';p.style.filter='none'}if(componentState==='paper'){const p=mesh.querySelector('path');p.style.strokeWidth='38';p.style.filter='none'}}
if(component==='PhotoExport'&&componentState==='permission'&&!document.querySelector('#permission-dialog')){scene.insertAdjacentHTML('beforeend',`<div class="dialog-layer" id="permission-dialog"><div class="dialog"><h2>允许 AirRibbon 保存图片？</h2><div class="row"><button id="permission-deny">拒绝</button><button id="permission-allow">允许</button></div></div></div>`);$('#permission-allow').onclick=()=>{componentState='success';mode='normal';effect='export';renderScene()};$('#permission-deny').onclick=()=>{componentState='permissionDenied';mode='error';effect='error';renderScene()}}
if(component==='PhotoExport'&&componentState==='permissionDenied'){const r=document.querySelector('[data-preview-id="export-result"]');if(r)r.textContent='权限未授予，可重试'}
if(component==='StartPanel'&&componentState==='constrained'){const g=document.querySelector('.window-grid'),cta=document.querySelector('.cta');if(g)g.style.gridTemplateColumns='1fr';if(cta){cta.style.position='sticky';cta.style.bottom='0'}}
if(component==='ClearConfirmDialog'&&componentState==='constrained'){const row=document.querySelector('#confirm-dialog .row');if(row)row.style.flexDirection='column'}
if(component==='ClearConfirmDialog'&&componentState==='empty'){const d=document.querySelector('#confirm-dialog');if(d)d.remove();const s=document.createElement('div');s.className='status';s.textContent='当前没有可清空内容';scene.appendChild(s)}}
function renderScene(){const app=$('#app');app.classList.toggle('drawing',current==='ST-DRAWING');app.classList.toggle('error-mode',mode==='error');app.dataset.component=component;app.dataset.componentState=componentState;scene.dataset.state=current;if(current==='ST-WELCOME')scene.innerHTML=welcome();else scene.innerHTML=artwork()+dock()+status()+manip()+photo()+clearDialog();wire();applyBindings();applyScenario()}
function confirmation(text,onYes){scene.insertAdjacentHTML('beforeend',`<div class="dialog-layer" id="confirm-dialog"><div class="dialog"><h2>${text}</h2><div class="row"><button id="dialog-cancel">取消</button><button id="dialog-confirm">确认</button></div></div></div>`);$('#dialog-cancel').onclick=()=>{$('#confirm-dialog').remove()};$('#dialog-confirm').onclick=()=>{onYes();renderScene()}}
function act(id){const t=transitions[id];effect='';if(t?.confirm)return confirmation(t.confirm,()=>{current=t.to});if(id==='CLEAR-CANCEL'){current='ST-DRAW-READY'}else if(id==='CLEAR-CONFIRM'){strokeCount=0;current='ST-DRAW-READY'}else if(id==='TR-UNDO'){strokeCount=Math.max(0,strokeCount-1)}else if(id==='EXPORT-RETRY'){mode='normal';effect='export';componentState='success';current='ST-PHOTO';$('#data-mode').value='normal'}else if(id==='TR-EXPORT'&&mode==='error'){effect='error';current='ST-PHOTO'}else{current=t?.to||current;effect=t?.effect||''}renderScene();$('#state-select').value=current}
function wire(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action))}
states.forEach(s=>$('#state-select').add(new Option(s,s)));$('#state-select').onchange=e=>{current=e.target.value;effect='';renderScene()};$('#data-mode').onchange=e=>{mode=e.target.value;renderScene()};document.querySelectorAll('[data-responsive]').forEach(b=>b.onclick=()=>{$('#app').className=`app tier-${b.dataset.responsive}${$('#reduce-motion').checked?' reduce-motion':''}`});$('#reduce-motion').onchange=e=>$('#app').classList.toggle('reduce-motion',e.target.checked);
Object.keys(scenarios).forEach(c=>$('#component-select').add(new Option(c,c)));function fillStates(){const s=$('#component-state');s.innerHTML='';scenarios[component].forEach(x=>s.add(new Option(x,x)));componentState=s.value;proof()}function proof(){componentState=$('#component-state').value;const disabled=componentState.includes('disabled')||componentState==='empty'||componentState==='hidden';const p=$('#scenario-proof');p.dataset.componentState=componentState;p.className='inspector scenario-'+componentState;p.innerHTML=`<span class="shape ${componentState.includes('error')?'triangle':componentState.includes('safe')?'dashed':'diamond'}"></span><b>${component} · ${componentState}</b><button ${disabled?'disabled':''}>${disabled?'当前不可操作':'执行组件动作'}</button><div>stack=${componentState.includes('error')?'highest':'component-rule'} · variant=${componentState}</div>`;effect=componentState==='safeStop'?'safeStop':componentState==='error'||componentState==='permissionDenied'?'error':'';if(component==='PhotoExport'&&componentState==='permissionDenied'){mode='error';$('#data-mode').value='error'}else if(component==='PhotoExport'&&componentState==='success'){mode='normal';effect='export';$('#data-mode').value='normal'}if(component==='TrailCanvas')current=componentState==='drawing'?'ST-DRAWING':componentState==='edit'?'ST-EDIT':'ST-DRAW-READY';if(component==='MaterialDock')current=componentState==='photo'?'ST-PHOTO':'ST-DRAW-READY';if(component==='SafetyStatus')current=componentState==='drawing'?'ST-DRAWING':componentState==='edit'?'ST-EDIT':componentState==='controller'?'ST-CONTROLLER':'ST-DRAW-READY';if(component==='ArtworkManipulator')current='ST-EDIT';if(component==='PhotoExport')current='ST-PHOTO';if(component==='StartPanel')current='ST-WELCOME';if(component==='ClearConfirmDialog')current=componentState==='hidden'||componentState==='empty'?'ST-DRAW-READY':'ST-CLEAR-CONFIRM';renderScene()}$('#component-select').onchange=e=>{component=e.target.value;fillStates()};$('#component-state').onchange=proof;fillStates();renderScene();
</script></body></html>
